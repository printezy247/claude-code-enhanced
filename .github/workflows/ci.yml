name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: npm ci
      # Fail the build on known-vulnerable runtime dependencies. Dev-only
      # tooling (electron-builder chain) is excluded: its advisories cannot
      # ship to users.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      # Dependency-free E2E smoke harness (no playwright). Runs headless under xvfb.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: E2E smoke
        run: xvfb-run -a node test/e2e/smoke.mjs

  build:
    # Builds the deb and lints it. Allowed to fail on a normal PR if the runner
    # lacks a system library electron-builder needs; the test job is the gate.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: npm ci
      - name: Install lintian
        run: sudo apt-get update && sudo apt-get install -y lintian
      # On a push electron-builder sees CI and tries to publish to a release, which
      # fails without a token and left every push to main red. Only build here.
      - run: npm run dist -- --publish never
      # lintian is skipped when the payload matches the last clean run (scripts/lint.sh).
      - name: Remember the last clean lintian run
        uses: actions/cache@v4
        with:
          path: .cache/lint
          key: lintian-${{ github.sha }}
          restore-keys: |
            lintian-
      - run: npm run lint
      # Keep the installable package: a build that only lints it is of no use to
      # someone who wants to try the change. Download it from the run's page.
      - name: Upload the deb
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-enhanced-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  mutation:
    # Opt-in: runs stryker only when it is installed (it is not a dependency
    # in this batch). Skips cleanly otherwise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - run: npm ci
      - name: Mutation testing (stryker, opt-in)
        run: |
          if [ -x node_modules/.bin/stryker ] || npx --no-install stryker --version >/dev/null 2>&1; then
            npx stryker run
          else
            echo "skipped: stryker not installed"
          fi
